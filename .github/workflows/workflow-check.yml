name: Workflow validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: ./scripts/install-actionlint.sh
      - name: Validate workflow syntax and expressions
        run: ./scripts/quiet-run.sh "workflow validation" ./scripts/check-workflows.sh
